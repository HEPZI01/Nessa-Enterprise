<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nessa Enterprise - Create a new customer account.">
  <title>Sign Up — Nessa Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="login-page">
    <div style="position:absolute;top:10%;left:8%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,0.15),transparent 70%);z-index:0;"></div>
    <div style="position:absolute;bottom:10%;right:8%;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,0.1),transparent 70%);z-index:0;"></div>

    <div class="login-card animate-fadeInUp">
      <div class="login-brand">
        <div class="login-brand-icon">N</div>
        <h2>Nessa Store</h2>
        <p>Create a Customer Account</p>
      </div>

      <div class="login-error" id="registerError"></div>

      <form id="registerForm" autocomplete="off">
        <div class="mb-3">
          <label class="form-label" for="regName">Full Name</label>
          <div class="position-relative">
            <input type="text" class="form-control" id="regName" placeholder="Enter your full name" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="regEmail">Email Address</label>
          <div class="position-relative">
            <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="regPassword">Password</label>
          <div class="position-relative">
            <input type="password" class="form-control" id="regPassword" placeholder="Create a password" required pattern=".{6,}" title="Six or more characters">
            <button type="button" id="toggleRegPassword" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.4);cursor:pointer;">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="registerSubmitBtn">Create Account</button>
      </form>

      <div class="mt-4 text-center" style="border-top:1px solid rgba(255,255,255,0.08);padding-top:16px;">
        <p style="color:rgba(255,255,255,0.5);font-size:14px;margin:0;">Already have an account? <a href="login.html" style="color:var(--primary-300);text-decoration:none;font-weight:600;">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/excelService.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('nessa_session')) {
        localStorage.removeItem('nessa_session');
      }
      if (Auth.isLoggedIn()) {
        Auth.redirectByRole();
      }
      Auth.init();
      
      const pwdInput = document.getElementById('regPassword');
      const toggleRegPwdBtn = document.getElementById('toggleRegPassword');
      if (toggleRegPwdBtn) {
        toggleRegPwdBtn.addEventListener('click', () => {
          const icon = toggleRegPwdBtn.querySelector('i');
          if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.className = 'bi bi-eye-slash';
          } else {
            pwdInput.type = 'password';
            icon.className = 'bi bi-eye';
          }
        });
      }
    });
  </script>
</body>
</html>
